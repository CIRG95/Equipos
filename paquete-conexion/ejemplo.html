<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terreno · conexión (prueba)</title>
<link rel="stylesheet" href="../vendor/fuentes/fuentes.css">
<style>
/* Página de prueba del paquete de conexión: hace de «app de Terreno» mínima en el teléfono. */
:root{--marca:#1D5C63;--bg:#F6F5F1;--sup:#fff;--ink:#1C1F23;--muted:#5B6168;--borde:#E2E0DA;--rojo:#B42318;--ambar:#B4500F;--ok:#2E7D4F}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--sup);border-bottom:1px solid var(--borde);padding:14px max(16px,env(safe-area-inset-left)) 12px}
header small{color:var(--muted)} header b{display:block;font-size:18px}
main{padding:14px max(16px,env(safe-area-inset-left)) 32px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
section{background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:16px} p{margin:0} .tenue{color:var(--muted);font-size:13px}
button,select,input,textarea{font:inherit} button{min-height:44px;border-radius:10px;border:1px solid var(--borde);background:var(--sup);padding:8px 14px;cursor:pointer}
button.pri{background:var(--marca);border-color:var(--marca);color:#fff;font-weight:600} button.rojo{background:var(--rojo);border-color:var(--rojo);color:#fff;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--borde);border-radius:10px;padding:10px;background:var(--sup);color:var(--ink)}
.codigo{font-family:"IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;font-size:20px}
.fila{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EFEDE8} .fila:last-child{border-bottom:0}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:#EFEDE8} .chip.rojo{background:#FDE8E6;color:#8A1C12} .chip.ok{background:#E6F2EA;color:#1F5C38}
.seg{display:flex;border:1px solid var(--borde);border-radius:10px;overflow:hidden} .seg label{flex:1;text-align:center;padding:10px;cursor:pointer} .seg input{display:none} .seg input:checked+span{font-weight:700;color:var(--marca)}
.msg{background:#E6F2EA;color:#1F5C38;border-radius:10px;padding:10px} .err{background:#FDE8E6;color:#8A1C12}
.tramos{display:flex;flex-wrap:wrap;gap:6px} .tramos button{min-height:36px;padding:4px 10px;font-family:"IBM Plex Mono",monospace;font-size:13px} .tramos button.si{background:var(--ok);border-color:var(--ok);color:#fff}
</style></head>
<body>
<header><small>App de Terreno · prueba de conexión</small><b id="quien">Sin vincular</b></header>
<main id="app"></main>
<script src="../config.js"></script>
<script src="topoland-conexion.js"></script>
<script>
const C = window.TopolandConexion, $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ini = C.iniciar({ clienteId: (window.TOPOLAND_CONFIG || {}).googleClientId });
let msg = null, proyectoSel = '';

async function pintar() {
  const p = C.persona(), n = C.estadoNube();
  $('#quien').textContent = p ? p.nombre : 'Sin vincular';
  let h = msg ? `<div class="msg ${msg.err ? 'err' : ''}">${esc(msg.t)}</div>` : '';
  msg = null;
  if (!p) {
    if (C.codigoQR()) { const r = await C.vincular(C.codigoQR()); if (r) return pintar(); }
    h += `<section><h2>Vincular este teléfono</h2><p class="tenue">Escanea el QR desde Sistema → Personas → Vincular teléfono, o escribe el código.</p>
      <input id="cod" class="codigo" maxlength="8" placeholder="ABC234" value="${esc(C.codigoQR() || '')}" autocapitalize="characters">
      <button class="pri" data-a="vincular">Vincular</button>
      ${n.carpetaId ? '' : `<p class="tenue">${ini.carpetaPendiente ? 'El QR trajo la carpeta de la nube.' : ''} En un teléfono nuevo, conecta la nube para traer las personas.</p><button data-a="nube">Conectar nube (Google)</button>`}</section>`;
    app.innerHTML = h; return;
  }
  const [proys, eqs] = await Promise.all([C.misProyectos(), C.misEquiposEnTerreno()]);
  h += `<section><h2>Mis proyectos</h2>${proys.length ? proys.map(x => `<div class="fila"><span>${esc(x.nombre)}<br><span class="tenue">${esc(x.mandante)}</span></span><button data-a="tramos" data-id="${x.id}">Tramos</button></div>`).join('') : '<p class="tenue">No eres encargado de ningún proyecto activo.</p>'}</section>`;
  if (proyectoSel) {
    const t = await C.tramosDeProyecto(proyectoSel);
    h += `<section><h2>Tramos volados ${t && t.ciclo ? '· ' + esc(t.ciclo.nombre) : ''}</h2>${t ? t.areas.map(a => `<p class="tenue">${esc(a.nombre)}</p><div class="tramos">${a.tramos.map(x => `<button class="${x.volado ? 'si' : ''}" data-a="volado" data-id="${x.id}" data-v="${x.volado ? 0 : 1}" title="${esc(x.nombre)}">${esc(x.n)}</button>`).join('')}</div>`).join('') : '<p class="tenue">Este proyecto no tiene seguimiento.</p>'}<p class="tenue">Toca un tramo para marcarlo volado hoy (verde) o desmarcarlo.</p></section>`;
  }
  h += `<section><h2>Problema o aviso de un equipo</h2>
    ${eqs.length ? `<select id="eq">${eqs.map(e => `<option value="${e.id}">${esc(e.nombre)}${e.alertasActivas.length ? ' · ya tiene alerta' : ''}</option>`).join('')}</select>
      <div class="seg"><label><input type="radio" name="tipo" value="problema" checked><span>Problema</span></label><label><input type="radio" name="tipo" value="aviso"><span>Aviso</span></label></div>
      <textarea id="desc" rows="3" placeholder="Qué pasa: no enciende, se cayó el bastón, batería baja…"></textarea>
      <button class="rojo" data-a="reportar">Enviar al encargado y a Administración</button>
      <p class="tenue">Llega al Sistema con la próxima sincronización. Sin señal queda guardado y sale después.</p>`
      : '<p class="tenue">No tienes equipos en terreno. Salen con el checklist de salida de Equipos.</p>'}</section>
    <section><h2>Nube</h2><p class="tenue">${n.carpetaId ? `Carpeta: ${esc(n.carpetaNombre || '')}${n.ultimaSync ? ' · última sincronización ' + new Date(n.ultimaSync).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) : ''}${n.pendiente ? ' · hay cambios por subir' : ''}` : 'Sin nube: los datos quedan en este teléfono.'}</p>
      <button data-a="nube">${n.conectado ? 'Sincronizar ahora' : 'Conectar nube (Google)'}</button><button data-a="desvincular">Desvincular este teléfono</button></section>`;
  app.innerHTML = h;
}

app.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  try {
    if (b.dataset.a === 'vincular') { const r = await C.vincular($('#cod').value); msg = r ? { t: `Vinculado: ${r.nombre}` } : { t: 'No encontré ese código en este teléfono. Si es un teléfono nuevo, conecta la nube primero.', err: true }; }
    else if (b.dataset.a === 'nube') { const e = C.estadoNube(); if (e.conectado) await C.sincronizar(); else await C.conectarNube(); msg = { t: 'Nube al día' }; }
    else if (b.dataset.a === 'desvincular') { C.desvincular(); msg = { t: 'Teléfono desvinculado' }; }
    else if (b.dataset.a === 'tramos') proyectoSel = proyectoSel === b.dataset.id ? '' : b.dataset.id;
    else if (b.dataset.a === 'volado') { await C.marcarTramoVolado(proyectoSel, b.dataset.id, { volado: b.dataset.v === '1' }); }
    else if (b.dataset.a === 'reportar') { await C.reportar({ equipoId: $('#eq').value, tipo: document.querySelector('input[name=tipo]:checked').value, descripcion: $('#desc').value }); msg = { t: 'Enviado. Lo verán el encargado del proyecto y Administración.' }; }
  } catch (e) { console.error(e); msg = { t: e.message || 'No se pudo', err: true }; }
  pintar();
});
C.alLlegarDatos(() => pintar());
pintar();
</script>
</body></html>
