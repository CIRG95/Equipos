<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Equipos · prueba</title>
  <meta name="theme-color" content="#1D5C63">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="modulos/equipos/equipos.css">
  <style>
    /* Envoltorio de prueba con la estética D de Terreno Topografía v0.4.1 (en la app global se reemplaza).
       Las variables son las mismas de Terreno: el módulo las hereda. */
    :root{
      --bg:#EEF2F0; --surface:#FFFFFF; --ink:#16232B; --primary:#1D5C63; --primary-dark:#123F44;
      --accent:#C24A17; --line:#C7D1CD; --muted:#5B6B66; --danger:#B3261E; --ok:#2E7D4F;
      --radius:14px; --soft:0 2px 10px rgba(22,35,43,0.10);
      --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{font-family:var(--sans); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;}

    header.app-header{
      position:sticky; top:0; z-index:20; background:var(--primary); color:#fff;
      padding:12px 16px 14px; padding-top:max(12px, env(safe-area-inset-top));
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-radius:0 0 16px 16px; box-shadow:0 3px 12px rgba(18,63,68,0.25);
    }
    header.app-header h1{font-size:18px; margin:0; font-weight:700; letter-spacing:-0.01em;}
    header.app-header h1 small{font-size:11px; font-weight:600; opacity:.75; margin-left:4px;}
    header.app-header .subtitle{font-size:12px; opacity:.85; margin-top:2px;}
    .env-der{display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
    .env-fila{display:flex; gap:6px; align-items:center;}
    .pill{
      font-family:var(--sans); font-size:12px; padding:5px 10px; border-radius:999px; white-space:nowrap;
      background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff;
    }
    select.pill{appearance:none; -webkit-appearance:none; padding-right:22px; cursor:pointer; max-width:150px;
      background-image:linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
      background-position:calc(100% - 12px) 52%, calc(100% - 8px) 52%; background-size:4px 4px; background-repeat:no-repeat;}
    select.pill option{color:var(--ink);}
    .redondo{background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); border-radius:999px;
      width:28px; height:28px; color:#fff; cursor:pointer; font-size:14px; line-height:1; padding:0;}

    #contenedor-modulo{max-width:640px; margin:0 auto; padding:16px;}

    /* Modo PC: encabezado flotante con las pestañas del módulo dentro, panel blanco al centro (como Terreno). */
    body[data-modo="pc"]{background:var(--bg) linear-gradient(rgba(22,35,43,0.06) 1px, transparent 1px) 0 0/24px 24px fixed;}
    body[data-modo="pc"] header.app-header{position:fixed; top:12px; left:12px; right:12px; border-radius:12px; padding:8px 16px; min-height:64px;}
    body[data-modo="pc"] #contenedor-modulo{
      max-width:none; width:min(1100px, calc(100vw - 24px)); margin:100px auto 12px;
      background:rgba(255,255,255,0.93); border-radius:14px; box-shadow:0 4px 18px rgba(22,35,43,0.20); padding:16px 18px;
      min-height:calc(100vh - 112px);
    }
    button.pill{cursor:pointer;}
    .pill-nube[data-estado="ok"]{background:rgba(255,255,255,0.22);}
    .pill-nube[data-estado="error"]{background:#C24A17; border-color:#C24A17;}

    /* Panel de nube (hoja inferior en teléfono, ventana al centro en PC, como los modales de Terreno) */
    dialog.nube-panel{border:0; padding:16px; width:100%; max-width:560px; max-height:88vh; overflow:auto;
      border-radius:16px 16px 0 0; margin:auto auto 0; color:var(--ink); font-family:var(--sans); font-size:14px;}
    body[data-modo="pc"] dialog.nube-panel{border-radius:16px; margin:auto;}
    dialog.nube-panel::backdrop{background:rgba(15,25,30,0.55);}
    .np-cab{display:flex; justify-content:space-between; align-items:center; font-size:16px; color:var(--primary-dark); margin-bottom:8px;}
    .np-x{background:none; border:0; font-size:20px; color:var(--muted); cursor:pointer;}
    .np-cuerpo p{margin:6px 0 10px;}
    .np-btn{min-height:42px; padding:8px 14px; border-radius:10px; border:1px solid var(--primary); background:#fff; color:var(--primary); font:inherit; font-weight:600; cursor:pointer;}
    .np-btn.primario{background:var(--accent); border-color:var(--accent); color:#fff; width:100%;}
    .np-btn.chico{min-height:34px; padding:5px 10px; font-size:13px;}
    .np-caja{border:1px solid #D3DDD8; border-radius:12px; padding:12px; margin:10px 0;}
    .np-caja > b{display:block; color:var(--primary-dark); margin-bottom:4px;}
    .np-caja ol{margin:6px 0 8px; padding-left:20px;}
    .np-check{display:flex; gap:8px; align-items:flex-start; margin:8px 0; font-size:13px; color:#44534E;}
    .np-check input{margin-top:2px; accent-color:var(--primary);}
    dialog.nube-panel form{display:flex; gap:8px; margin-top:8px;}
    dialog.nube-panel input:not([type=checkbox]){flex:1; min-width:0; min-height:42px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font:inherit;}
    .np-lista{list-style:none; padding:0; margin:8px 0;} .np-lista li{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid #E3E9E6;}
    .np-datos{display:grid; gap:8px; margin:0 0 12px;} .np-datos dt{font-size:11px; color:var(--muted);} .np-datos dd{margin:0; font-weight:500;}
    .np-datos a{color:var(--primary);}
    .np-enlace{display:flex; gap:6px;} .np-enlace input{font-size:12px !important; font-family:var(--mono) !important;}
    .np-pie{display:flex; gap:8px; justify-content:flex-end; margin-top:10px;}
    .np-msg{padding:8px 12px; border-radius:10px; margin:0 0 10px;} .np-msg.ok{background:#EAF3EC; color:#1F5A38;} .np-msg.error{background:#FBEAEA; color:#8F1D17;}
    .np-ok{color:#1F5A38;} .np-aviso{background:#FCEDE6; color:#8A3410; padding:10px 12px; border-radius:10px;}
    .np-error-txt{color:#8F1D17;} .np-tenue{color:var(--muted); font-size:12px;} .np-nota{margin-top:14px;}
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Equipos <small id="env-version"></small></h1>
      <div class="subtitle" id="env-subtitulo">App de prueba del módulo</div>
    </div>
    <div class="env-der">
      <div class="env-fila">
        <select id="env-rol" class="pill" title="Rol">
          <option value="terreno">Terreno</option>
          <option value="rrhh">RRHH</option>
        </select>
        <button id="env-modo" class="redondo" type="button" title="Modo de la pantalla">⇄</button>
        <button id="env-nueva-persona" class="redondo" type="button" title="Agregar persona">+</button>
      </div>
      <div class="env-fila">
        <select id="env-persona" class="pill" title="Persona"></select>
        <button id="env-nube" class="pill pill-nube" type="button" title="Sincronizar con Google Drive">☁ Conectar nube</button>
      </div>
    </div>
  </header>
  <div id="contenedor-modulo"></div>
  <!-- equipos-app.js = compartido/ + modulos/equipos/ + envoltorio.js empaquetados en un script clásico.
       Así abre con doble clic (file://), en GitHub Pages y sin internet. -->
  <script src="config.js"></script>
  <script src="equipos-app.js"></script>
  <script>
    // Si en 4 s el módulo no arrancó, mostrar por qué en vez de dejar la pantalla vacía.
    setTimeout(function () {
      if (window.__equiposCargado) return;
      var c = document.getElementById('contenedor-modulo');
      if (c && !c.children.length) c.innerHTML = '<div style="background:#FBEAEA;color:#8F1D17;border:1px solid #E3A8A5;border-radius:10px;padding:14px;margin:16px">' +
        '<b>El módulo no cargó.</b><br>Revisa que la carpeta tenga el archivo <code>equipos-app.js</code> junto a <code>index.html</code>. ' +
        'Si está en GitHub Pages, recarga con Ctrl+Shift+R. Abre la consola (F12) para ver el detalle.</div>';
    }, 4000);
  </script>
</body>
</html>
