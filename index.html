<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Topoland · Sistema</title>
  <meta name="theme-color" content="#FFFFFF">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="vendor/fuentes/fuentes.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app/sistema.css">
  <link rel="stylesheet" href="modulos/equipos/equipos.css">
  <link rel="stylesheet" href="modulos/vuelos/vuelos.css">
  <link rel="stylesheet" href="modulos/seguimiento/seguimiento.css">
  <link rel="stylesheet" href="modulos/monografias/monografias.css">
  <link rel="stylesheet" href="modulos/gastos/gastos.css">
  <link rel="stylesheet" href="modulos/administracion/administracion.css">
  <link rel="stylesheet" href="modulos/planificacion/planificacion.css">
</head>
<body>
  <header class="sis-header">
    <div class="sis-marca">
      <div class="sis-logo" aria-hidden="true">T</div>
      <div><b>Topoland</b><span>Sistema de trabajo · <span id="sis-version"></span></span></div>
    </div>
    <nav class="sis-menu" id="sis-menu" aria-label="Secciones"></nav>
    <div class="sis-buscador" role="search">
      <input id="sis-buscar" type="search" autocomplete="off" placeholder="Buscar PR, N° de serie, patente, persona…" aria-label="Buscar en todo el Sistema" aria-controls="sis-buscar-res" aria-expanded="false">
      <div class="sis-buscador-res" id="sis-buscar-res" role="listbox" hidden></div>
    </div>
    <div class="sis-quien">
      <select id="sis-persona" class="pill" aria-label="Persona"></select>
      <select id="sis-rol" class="pill" aria-label="Rol"></select>
    </div>
    <div class="sis-acciones-cab">
      <a id="sis-avisos" class="sis-campana" href="#/avisos" hidden title="Avisos" aria-label="Avisos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 004 0"/></svg><b></b></a>
      <button id="sis-nube" class="pill pill-nube" type="button" title="Sincronizar con Google Drive">Conectar nube</button>
      <button id="sis-modo" class="redondo" type="button" title="Cambiar modo teléfono / computador" aria-label="Cambiar modo de pantalla">⇄</button>
    </div>
  </header>
  <div id="sis-contenido"></div>
  <div id="sis-aviso" class="sis-aviso-flotante" role="status" hidden></div>
  <!-- sistema-app.js = compartido/ + modulos/ + app/ empaquetados en un script clásico (abre con doble clic y sin internet). -->
  <script src="config.js"></script>
  <script src="sistema-app.js"></script>
  <script>
    // Revisión del arranque. Si la base de datos está esperando a otra app (p. ej. Terreno en segundo plano),
    // se dice eso y se sigue esperando: apenas la otra app la suelte, el Sistema termina de cargar solo.
    (function () {
      var inicio = Date.now();
      var t = setInterval(function () {
        var c = document.getElementById('sis-contenido');
        if (window.__sistemaCargado) { clearInterval(t); return; }
        if (!c || (c.children.length && !c.querySelector('.sis-espera-bd, .sis-error-carga'))) return;
        var s = (Date.now() - inicio) / 1000;
        if (window.__topolandBdEsperando && s > 3) {
          if (!c.querySelector('.sis-espera-bd')) c.innerHTML = '<div class="sis-error sis-espera-bd"><b>Esperando los datos.</b><br>' + (window.__topolandBdBloqueada ? 'La app de Terreno u otra pestaña del Sistema tiene los datos abiertos.' : 'Otra app o pestaña está terminando de usar los datos.') + ' Ciérrala (en el teléfono, desde las apps recientes) y el Sistema terminará de cargar solo.</div>';
        } else if (!window.__topolandBdEsperando && s > 8 && !c.querySelector('.sis-error-carga')) {
          c.innerHTML = '<div class="sis-error sis-error-carga"><b>El Sistema no cargó.</b><br>Recarga la página (en el computador, Ctrl+Shift+R). Si sigue igual, revisa que la carpeta tenga <code>sistema-app.js</code> junto a <code>index.html</code>; la consola (F12) muestra el detalle.</div>';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
